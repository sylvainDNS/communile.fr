name: Preview URL

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment the Cloudflare Pages preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- cloudflare-preview-url -->'
            const PROJECT = 'communile-fr'

            // Cloudflare Pages n'expose pas l'URL de preview dans la PR : son app GitHub
            // ne publie qu'un check run pointant vers son tableau de bord, et ne crée
            // aucun GitHub Deployment. L'alias est heureusement déterministe.
            //
            // Règle : minuscules, tout caractère non alphanumérique devient un tiret,
            // puis troncature à 28 caractères. La troncature n'est pas documentée mais
            // elle est vérifiée : `001-page-brasserie-navigation` (29) renvoie 404,
            // `001-page-brasserie-navigatio` (28) renvoie 200.
            const branch = context.payload.pull_request.head.ref
            const alias = branch
              .toLowerCase()
              .replace(/[^a-z0-9]/g, '-')
              .slice(0, 28)
              .replace(/-+$/, '')

            const url = `https://${alias}.${PROJECT}.pages.dev`

            const body = [
              MARKER,
              '### 🔍 Review app',
              '',
              `**${url}**`,
              '',
              '| | |',
              '|---|---|',
              `| Accueil | ${url}/ |`,
              `| Sitemap | ${url}/sitemap.xml |`,
              `| robots.txt | ${url}/robots.txt |`,
              '',
              `Déployée par Cloudflare Pages depuis \`${branch}\`.`,
              'Le lien devient actif une fois le check « Cloudflare Pages » au vert.',
            ].join('\n')

            const { owner, repo } = context.repo
            const issueNumber = context.payload.pull_request.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
            })
            const existing = comments.find(comment => comment.body?.includes(MARKER))

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              })
            }
